{{define "overview"}}<p class="kicker">OPERATIONS / NODE</p><h1>服务概览</h1><p>版本 <code>{{.Build.Version}}</code> · 提交 <code>{{.Build.Commit}}</code> · 构建时间 {{if and .Build.BuildDate (ne .Build.BuildDate "unknown")}}<time datetime="{{.Build.BuildDate}}">{{.Build.BuildDate}}</time>{{else}}未知{{end}}</p><div role="status" class="pair section-title"><section class="panel"><p class="kicker">HTTP / HEALTHZ</p><h2>进程：<span id="live">存活</span></h2></section><section class="panel"><p class="kicker">STORAGE / READYZ</p><h2>存储：<span id="ready">{{.Ready}}</span></h2></section></div><p>检查时间：<time id="checked" datetime="{{.Time}}">{{.Time}}</time></p><button id="probe">重新检查</button>{{end}}
