{{define "accounts"}}<p class="kicker">ADMINISTRATION / ACCESS</p><h1>账号管理</h1>{{if .Message}}<p role="status">{{.Message}}</p>{{end}}<div class="pair section-title"><section class="panel"><h2>创建账号</h2><form class="fields" method="post" action="/accounts/create"><label>新用户名<input name="username" required autocomplete="off"></label><label>初始密码<input type="password" name="password" required autocomplete="new-password"></label><button class="action">创建账号</button></form></section><section class="panel aside"><h2>重置密码</h2><p>先核对目标账号，再设置新密码。</p><form class="fields" method="post" action="/accounts/review"><label>目标用户名<input name="username" required autocomplete="off"></label><button id="review-reset">核对重置影响</button></form></section></div>{{end}}
{{define "confirm"}}<section class="panel notice"><p class="kicker">ACCOUNT / CONFIRM</p><h1>核对重置影响</h1><p>重置 <strong>{{.Data}}</strong> 的密码后，该账号所有设备的 Web 和 CLI 会话都会失效。</p>{{if .Message}}<p role="alert">{{.Message}}</p>{{end}}<a class="inline" id="cancel-reset" href="/accounts#review-reset" autofocus>取消，返回账号管理</a><form class="fields" method="post" action="/accounts/reset"><input type="hidden" name="username" value="{{.Data}}"><label>新密码<input name="password" type="password" required autocomplete="new-password"></label><label><span><input type="checkbox" name="confirm" value="yes" required> 我已核对账号并确认撤销所有会话</span></label><button class="action">确认重置密码</button></form></section>{{end}}
