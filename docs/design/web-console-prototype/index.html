 return hero+`<section class="panel pad spaced"><div class="eyebrow">STEP 01 / 02</div><h2>从哪个版本找？</h2><label class="choice">选择已发布版本<select id="pick">${Object.entries(commits).map(([k,c])=>`<option value="${k}" ${selected===k?'selected':''}>${c[4]} · ${c[1]}</option>`).join('')}</select></label><div class="eyebrow spaced">STEP 02 / 02</div>${inspector(selected)}</section>`}

function snapshotView(page,k){const c=commits[k],t='tree/'+k;const base=crumb('快照 / '+c[0].slice(0,8),'版本历史','history');
 if(page==='file'||page==='handoff')return base+(page==='file'?heading('SNAPSHOT / FILE','文件检查','正在检查已发布快照中的元数据。')+`<article class="panel pad"><div class="eyebrow">${c[4]} / ${c[0].slice(0,8)}</div><h2 class="long">${filename}</h2><p class="long">${path}</p><dl class="fields"><div><dt>大小 / 块数</dt><dd>3,184 字节 · 1 块</dd></div><div><dt>修改时间</dt><dd>11-18 14:20 UTC</dd></div><div><dt>File ID</dt><dd><code>${fileID}</code></dd></div></dl>${link('handoff/'+k,'获取恢复预览命令',true)}</article>`:handoff(k));
 const dir=page==='folder';return base+heading('SNAPSHOT / DIRECTORY',dir?folder:'快照根目录',`${c[1]} · ${c[4]} · ${c[3]}`)+`<section class="panel"><div class="phead"><h2>${dir?'目录内容':'目录索引'}</h2><code>${dir?folder:'./'}</code></div>${dir?(hasDraft(k)?jump('file/'+k,filename,'普通文件 · 3,184 字节'):'<div class="pad"><h3>此版本没有校准草案</h3><p>回到 14:26 的合并提交，展开设备 B 的合并来源。</p></div>'):jump('folder/'+k,folder,'目录 · 查看此版的直接子项')}</section><div class="spaced">${link(dir?t:'history',dir?'返回快照根目录':'返回版本历史')}</div>`}
function preview(k){return `filecloud library restore --client-dir 'CLIENT_DIR' --worktree 'WORKTREE' --commit ${commits[k][0]} --path '${path}'`}
function handoff(k){return heading('HANDOFF / DEVICE CLI','交给本机预览','接下来在已绑定的设备上操作。网页不会修改 Head 或工作目录。')+`<section class="panel pad"><div class="eyebrow accent">SOURCE / ${commits[k][4]}</div><h2 class="long">${path}</h2><ol class="steps"><li>把 <code>CLIENT_DIR</code> 和 <code>WORKTREE</code> 换成本机目录。用 <code>filecloud library status</code> 带上这两个参数核对资料库 ID：<code>${libID}</code>。</li><li>先用相同目录参数运行 <code>filecloud library sync</code>，再执行下面的<strong>预览命令</strong>。示例路径在 POSIX shell 与 PowerShell 中均为单引号字面量。</li><li>阅读本机预览；只有决定应用时，才在 CLI 输入它给出的 12 位候选前缀。预览失效则重新同步并预览。</li></ol><pre class="cmd" id="command">${preview(k)}</pre><div class="actions"><button class="button primary" data-copy="command">复制预览命令</button>${link('file/'+k,'返回文件')}</div><p class="section-note">此命令使用原型的虚构版本，仅用于核对交接格式。</p></section>`}
function overview(){const h={ready:['存活','已就绪','服务已响应，可读写存储。'],degraded:['存活','未就绪','HTTP 进程已响应，存储检查返回 503。请到服务器排查。'],offline:['未知','未知','没有收到探针响应。请检查网络，不能据此判断存储损坏。']}[health];return crumb('服务概览','管理员','accounts')+heading('OPERATIONS / NODE 01','服务概览','分别查看进程与存储，避免把「能连上」误认为「能同步」。')+`<div class="toolbar"><span class="eyebrow">PROBE RESULTS</span><label>模拟探针场景 <select id="health">${[['ready','正常'],['degraded','存储未就绪'],['offline','连接中断']].map(([k,v])=>`<option value="${k}" ${health===k?'selected':''}>${v}</option>`).join('')}</select></label></div><div class="grid2">${[['进程 / healthz',h[0]],['存储 / readyz',h[1]]].map(([a,b])=>`<section class="panel pad"><div class="eyebrow">${a}</div><div class="big">${b}</div></section>`).join('')}</div><div class="status ${health==='ready'?'':'warn'}" role="status">${h[2]}</div><p class="section-note">本次模拟检查 14:35 UTC · 服务端构建 dev / 示例</p><section class="panel">${jump('libraries','查看我的资料库','从资料库进入主线历史与已发布快照')}${jump('accounts','管理账号','本机显式授权的管理员入口')}</section>`}
function accounts(){return crumb('账号管理','管理员','overview')+heading('ADMINISTRATION / ACCESS','账号管理','操作会影响目标用户的所有设备。此原型只使用预设账号，不接收真实密码。')+`<div class="cols"><section class="panel pad"><div class="eyebrow accent">PASSWORD RESET</div><h2>重置密码</h2><dl class="fields"><div><dt>目标账号</dt><dd>观测员 02 · <code>observer-02</code></dd></div><div><dt>新密码</dt><dd>使用模拟值，无须输入</dd></div></dl><button id="prepare" class="button primary">核对重置影响</button>${resetDone?'<div class="status" id="result" tabindex="-1" role="status">模拟重置完成。正式环境中，此账号需重新登录。</div>':''}</section><aside class="panel pad"><div class="eyebrow">ACCESS BOUNDARY</div><h2>授权范围</h2><p>管理员可以开户和重置密码。浏览资料库时，仍只看得到自己拥有的内容。</p></aside></div>`}
function render(focus){if(focus)$('#toast').textContent='';const [route,arg]=location.hash.slice(1).split('/');const k=Object.hasOwn(commits,arg)?arg:'head';let page=route||'history';let html;
 switch(page){case 'history':html=historyView();break;case 'libraries':html=libraries();break;case 'empty':html=empty();break;case 'accounts':html=accounts();break;case 'overview':html=overview();break;case 'tree':case 'folder':case 'file':case 'handoff':selected=k;if(k==='source')expanded=true;if((page==='file'||page==='handoff')&&!hasDraft(k))page='folder';html=snapshotView(page,k);break;default:page='libraries';html=libraries()}
 const section=['accounts','overview'].includes(page)?page:'libraries';$('nav').innerHTML=[['libraries','archive','资料库'],['overview','activity','服务概览'],['accounts','user','账号管理']].map(([p,i,t])=>`<a href="#${p}" ${section===p?'aria-current="page"':''}>${icon(i)}${t}</a>`).join('');
 $('#content').innerHTML=html+'<footer class="foot"><span>FILECLOUD &nbsp;/&nbsp; CONSOLE STUDIES</span><span>01 — 离线设计评审</span></footer>';$('#switch').hidden=page!=='history';$('#variantName').textContent='评审 '+variant+' · '+variantNames[ids.indexOf(variant)];document.title=$('h1').textContent+' · Filecloud 原型';if(focus){window.scrollTo(0,0);$('h1').focus({preventScroll:true})}}
function cycle(by){variant=ids[(ids.indexOf(variant)+by+3)%3];const u=new URL(location.href);u.searchParams.set('variant',variant);history.replaceState(null,'',u);render(false);notify('已切换：'+variantNames[ids.indexOf(variant)])}
function notify(text){$('#toast').textContent=text;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('#toast').textContent='',2400)}
async function copy(button){const command=button.dataset.copy==='command';const value=command?$('#command').textContent:commits[selected][0];try{await navigator.clipboard.writeText(value);notify(command?'已复制预览命令':'已复制完整提交 ID')}catch{const node=command?$('#command'):button.previousElementSibling;const range=document.createRange();range.selectNodeContents(node);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);notify('已选中文字，请手动复制')}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.choose){selected=b.dataset.choose;render(false);if(matchMedia('(max-width:650px)').matches){$('#inspect h2').focus()}else{$(`[data-choose="${selected}"]`).focus()}}else if(b.hasAttribute('data-expand')){expanded=!expanded;if(!expanded&&selected==='source')selected='merge';render(false);$('[data-expand]').focus()}else if(b.dataset.copy)copy(b);else if(b.id==='prev'||b.id==='next')cycle(b.id==='prev'?-1:1);else if(b.id==='prepare')$('dialog').showModal();else if(b.id==='cancel')$('dialog').close();else if(b.id==='confirm'){$('dialog').close();resetDone=true;render(false);$('#result').focus()}});
 document.addEventListener('change',e=>{if(e.target.id==='health'){health=e.target.value;render(false);$('#health').focus()}else if(e.target.id==='pick'){selected=e.target.value;expanded=selected==='source';render(false);$('#pick').focus()}});
 document.addEventListener('keydown',e=>{if($('#switch').hidden||e.altKey||e.metaKey||e.ctrlKey||e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});
 $('#skip').onclick=e=>{e.preventDefault();$('#content').focus()};window.addEventListener('hashchange',()=>render(true));render(false);
</script>
</body></html>
