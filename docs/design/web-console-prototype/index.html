function heading(k,title,text){return `<header class="heading"><div class="kicker eyeline">${k}</div><h1 tabindex="-1">${title}</h1><p>${text}</p></header>`}
function link(href,label,primary=false){return `<a class="button ${primary?'primary':''}" href="#${href}">${label}${icon('arrow')}</a>`}
function jump(href,title,desc,i='folder'){return `<a class="jump" href="#${href}"><span class="tile">${icon(i)}</span><span><strong>${title}</strong><small>${desc}</small></span>${icon('arrow')}</a>`}
function tag(k){return `<span class="tag ${k}">${commits[k][4]}</span>`}
function plateCaption(){return fan?'14:21 的来源在 14:26 合入主线':'展看图版 · 查看版本关系'}
function relationMap(){return `<svg class="map-face" viewBox="0 0 228 154" aria-hidden="true"><text x="15" y="24" fill="#284bc2" font-family="monospace" font-size="10">FIG. 02 / 版本关系</text><path d="M23 99H203" fill="none" stroke="#284bc2" stroke-width="2"/><path d="M23 99 Q39 99 52 75 T82 54 H106 Q124 54 135 78 T150 99" fill="none" stroke="#a34217" stroke-width="1.8" stroke-dasharray="4 3"/><g fill="#fff" stroke="#284bc2" stroke-width="2"><circle cx="23" cy="99" r="4"/><circle cx="82" cy="99" r="4"/><circle cx="150" cy="99" r="4"/><circle cx="203" cy="99" r="6"/></g><path d="m90 48 6 6-6 6-6-6z" fill="#a34217"/><g font-size="10" font-family="monospace" fill="#263246"><text x="70" y="42">来源 14:21</text><text x="14" y="121">首次</text><text x="122" y="121">合并 14:26</text><text x="187" y="86">Head</text></g></svg>`}
function plates(){return `<figure class="plate-stage"><button class="plates" id="plates" aria-pressed="${fan}" aria-label="显示版本关系图" aria-describedby="plate-note"><span class="plate back"></span><span class="plate middle"></span><span class="plate front"><svg viewBox="0 0 228 154" aria-hidden="true"><defs><pattern id="ticks" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".55" fill="#bbcafa"/></pattern><clipPath id="print"><rect x="8" y="9" width="212" height="136" rx="2"/></clipPath></defs><g clip-path="url(#print)"><rect x="8" y="9" width="212" height="136" fill="url(#ticks)"/><g fill="none" stroke="#cfdbff" stroke-width=".8" transform="translate(136 70) rotate(-28)"><circle r="47"/><ellipse rx="22" ry="47"/><ellipse rx="38" ry="47"/><ellipse rx="47" ry="17"/><ellipse rx="47" ry="34"/><path d="M-58 0H58M0-53V53"/><ellipse rx="88" ry="15" stroke="#ffc08c" stroke-width="1.8" transform="rotate(12)"/></g><g fill="#ffe4af"><path d="m49 40 1.5 5 5 1-5 1.5-1.5 5-1-5-5-1.5 5-1zM190 24l1 3.5 3.5 1-3.5 1-1 3.5-1-3.5-3.5-1 3.5-1z"/><circle cx="74" cy="84" r="3"/></g><g fill="#fff" font-family="monospace"><text x="16" y="24" font-size="8" letter-spacing="1.1">FC / ARCHIVE</text><text x="16" y="115" font-size="26" font-family="Georgia,serif" font-style="italic">Atlas.</text><text x="16" y="136" font-size="7.6" letter-spacing="1.1">PLATE Nº 01</text><text x="159" y="136" font-size="7.6">665922de</text></g></g></svg>${relationMap()}</span></button><figcaption class="plate-caption" id="plate-note">${plateCaption()}</figcaption></figure>`}
function hero(){return `${crumb('星野观测档案')}<header class="hero"><div class="hero-copy"><div class="kicker eyeline">COLLECTION Nº 01</div><h1 tabindex="-1">星野观测档案</h1><p>查阅已发布的观测记录，找回某一版的校准草案。</p><div class="hero-meta"><b>11 月 18 日</b><i></i><span>4 次主线提交 · 1 个合并来源</span></div></div>${plates()}</header>`}
function disclosure(){return `<button class="disclose" data-expand aria-expanded="${expanded}">${expanded?'收起':'展开'}合并来源 · 1</button>`}
function rows(){return expanded?['head','merge','source','remote','initial']:mainline}
function historyList(){return `<section class="panel"><div class="card-head"><h3>主线历史</h3><span class="count">按发布顺序</span></div><div class="versions">${rows().map(k=>{const [id,title,t,device]=commits[k];return `<button class="revision ${k==='source'?'src':''}" data-choose="${k}" aria-pressed="${selected===k}"><time>${t}</time><i class="node" aria-hidden="true"></i><span><b>${title}</b><small class="meta">${device} · <code>${id.slice(0,8)}</code></small></span>${tag(k)}</button>${k==='merge'?disclosure():''}`}).join('')}</div></section>`}
function inspector(k){const [id,title,t,device,role]=commits[k];return `<article class="panel inspector" id="inspect"><div class="cap"><span class="kicker eyeline">快照索引</span><span class="stamp" aria-hidden="true">№ ${k==='source'?'03b':String(4-mainline.indexOf(k)).padStart(2,'0')}</span></div><h2 tabindex="-1">${title}</h2><dl class="fields"><div><dt>版本角色</dt><dd>${role}${k==='source'?' · 归入 <code>53e318d8</code>':''}</dd></div><div><dt>来源设备</dt><dd>${device} · ${t} UTC</dd></div></dl><div class="id-slip"><code>${id}</code><button class="copy-icon" data-copy="commit" aria-label="复制完整提交 ID" title="复制完整提交 ID">${icon('copy')}</button></div><div class="actions">${link('tree/'+k,'检查此版快照',true)}</div></article>`}
function historyView(){let view;
 if(layout==='A')view=`<div class="pair">${historyList()}${inspector(selected)}</div>`;
 if(layout==='B')view=`<section class="panel pad"><div class="toolbar"><h3>提交账本</h3>${disclosure()}</div><table class="ledger"><thead><tr><th>版本</th><th>设备</th><th>角色</th></tr></thead><tbody>${rows().map(k=>`<tr class="${selected===k?'chosen':''}"><td><button data-choose="${k}" aria-pressed="${selected===k}">${commits[k][1]}<span class="meta mono">${commits[k][0].slice(0,8)}</span></button></td><td>${commits[k][3]}</td><td>${tag(k)}</td></tr>${selected===k?`<tr><td colspan="3">${inspector(k)}</td></tr>`:''}`).join('')}</tbody></table></section>`;
 if(layout==='C')view=`<section class="panel pad"><div class="kicker">01 / 选择来源</div><label class="choice">要查阅哪个已发布版本？<select id="pick">${Object.entries(commits).map(([k,c])=>`<option value="${k}" ${k===selected?'selected':''}>${c[4]} · ${c[1]}</option>`).join('')}</select></label><div class="kicker">02 / 核对快照</div>${inspector(selected)}</section>`;
 return hero()+`<div class="section-bar"><h2>版本工作台</h2><small>主线按第一父提交排列</small></div>`+view}
function libraries(){return crumb('资料库索引','工作区','overview')+heading('COLLECTIONS','我的资料库','从自己的资料库进入版本历史。')+`<section class="panel"><div class="card-head"><h3>馆藏目录</h3><span class="count">2 个资料库</span></div>${jump('history','星野观测档案','4 次主线提交 · Head 665922de')}${jump('empty','下一季观测','空资料库 · 等待首次发布')}</section>`}
function empty(){return crumb('下一季观测')+heading('COLLECTION Nº 02','下一季观测','资料库已创建，尚无已发布版本。')+`<section class="panel pad"><span class="symbol">${icon('folder')}</span><h2>从第一台设备开始</h2><p>在设备上用 CLI 绑定工作目录。导入已有文件时，显式选择首次导入。第一次发布后，这里就会出现版本历史。</p><div class="actions">${link('libraries','返回资料库')}</div></section>`}
function snapshot(page,k){const c=commits[k],base=crumb('快照 '+c[0].slice(0,8),'版本历史','history');
 if(page==='handoff')return base+handoff(k);
 if(page==='file')return base+heading('FILE RECORD','文件检查','正在查看已发布快照中的文件元数据。')+`<article class="panel pad"><span class="kicker">${c[4]} / ${c[0].slice(0,8)}</span><h2 class="long">${fileName}</h2><p class="long">${path}</p><dl class="fields"><div><dt>大小 / 块</dt><dd>3,184 字节 · 1 块</dd></div><div><dt>修改时间</dt><dd>11-18 14:20 UTC</dd></div><div><dt>文件 ID</dt><dd><code>${fileId}</code></dd></div></dl>${link('handoff/'+k,'获取恢复预览命令',true)}</article>`;
 const dir=page==='folder';let entry=jump('folder/'+k,folder,'目录 · 查看直接子项');if(dir)entry=hasDraft(k)?jump('file/'+k,fileName,'普通文件 · 3,184 字节','file'):'<div class="pad"><h2>此版本没有校准草案</h2><p>返回主线历史，展开 14:26 合并提交下的来源。</p></div>';
 return base+heading('DIRECTORY',dir?folder:'快照根目录',`${c[1]} · ${c[4]} · ${c[3]}`)+`<section class="panel"><div class="card-head"><h3>${dir?'目录内容':'目录索引'}</h3><code>${dir?folder:'./'}</code></div>${entry}</section><div class="actions">${link(dir?'tree/'+k:'history',dir?'返回快照根目录':'返回版本历史')}</div>`}
function handoff(k){return heading('DEVICE HANDOFF','交给本机预览','回到已绑定的设备后执行以下步骤。网页不会修改 Head 或工作目录。')+`<section class="panel pad"><span class="kicker">恢复来源 / ${commits[k][4]}</span><h2 class="long">${path}</h2><ol class="steps"><li>把 <code>CLIENT_DIR</code> 和 <code>WORKTREE</code> 替换成本机目录。用 <code>filecloud library status</code> 带上这两个参数核对资料库 ID：<code>${libraryId}</code>。</li><li>用相同目录参数运行 <code>filecloud library sync</code>，再执行下方预览命令。</li><li>阅读本机预览。决定应用后，在 CLI 输入它给出的 12 位候选前缀。预览失效时，重新同步并预览。</li></ol><pre class="cmd" id="command">filecloud library restore --client-dir 'CLIENT_DIR' --worktree 'WORKTREE' --commit ${commits[k][0]} --path '${path}'</pre><div class="actions"><button class="button primary" data-copy="command">${icon('copy')}复制预览命令</button>${link('file/'+k,'返回文件')}</div><p class="note">示例命令仅用于核对格式，路径用 POSIX shell 和 PowerShell 均支持的单引号引用。</p></section>`}
const probes={ready:['存活','已就绪','进程已响应，存储可用。'],degraded:['存活','未就绪','进程已响应，但存储检查返回 503。请到服务器排查。'],offline:['未知','未知','没有收到探针响应。先检查连接，再判断存储状态。']};
function overview(){const [live,ready,desc]=probes[health],state=health==='offline'?'unknown':'warn';return crumb('服务概览','管理员','accounts')+heading('OPERATIONS','服务概览','进程与存储分别检查，最近一次模拟检查为 14:35 UTC。')+`<div class="toolbar"><h2>服务探针</h2><label>模拟场景 <select id="health">${[['ready','正常'],['degraded','存储未就绪'],['offline','连接中断']].map(([k,s])=>`<option value="${k}" ${k===health?'selected':''}>${s}</option>`).join('')}</select></label></div><div class="grid2">${[['进程','healthz',live],['存储','readyz',ready]].map(([n,p,v])=>`<section class="panel pad probe ${['存活','已就绪'].includes(v)?'':state}"><div class="kicker">${n} / ${p}</div><div class="big">${v}</div></section>`).join('')}</div><div class="status ${health==='ready'?'':state}" role="status">${desc}</div><div class="panel">${jump('libraries','查看我的资料库','浏览主线历史与已发布快照','library')}${jump('accounts','管理账号','仅限本机显式授权的管理员','users')}</div><p class="note">构建版本 dev · 示例节点</p>`}
function accounts(){return crumb('账号管理','管理员','overview')+heading('ACCOUNT DESK','账号管理','核对目标用户和受影响的会话，再进行操作。')+`<div class="pair"><section class="panel pad"><span class="tile warn-tile">${icon('key')}</span><h2>重置密码</h2><dl class="fields"><div><dt>目标账号</dt><dd>观测员 02 · <code>observer-02</code></dd></div><div><dt>新密码</dt><dd>使用模拟值，无须输入</dd></div></dl><button class="button primary" id="prepare">核对重置影响 ${icon('arrow')}</button>${resetDone?'<div class="status" id="result" tabindex="-1" role="status">模拟重置完成。正式环境中，此账号需重新登录。</div>':''}</section><aside class="panel pad rule-note"><span class="kicker">权限说明</span><h2>管理账号，不代看文件</h2><p>管理员可以开户和重置密码。浏览资料库时，仍只看得到自己拥有的内容。</p></aside></div>`}
function render(focus=false){const [route,arg]=location.hash.slice(1).split('/');let page=route||'history',html;
 switch(page){case 'history':html=historyView();break;case 'overview':html=overview();break;case 'accounts':html=accounts();break;case 'empty':html=empty();break;case 'tree':case 'folder':case 'file':case 'handoff':selected=Object.hasOwn(commits,arg)?arg:'head';if(selected==='source')expanded=true;if(['file','handoff'].includes(page)&&!hasDraft(selected))page='folder';html=snapshot(page,selected);break;default:html=libraries()}
 const section=['overview','accounts'].includes(page)?page:'libraries';document.querySelectorAll('nav a').forEach(a=>{if(a.hash==='#'+section)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
 $('#content').innerHTML=html+'<footer class="foot"><span>Filecloud &nbsp; / &nbsp; 档案工作台</span><span>设计评审 · 02</span></footer>';if(page==='history')$('.section-bar').append(layoutDock);else document.body.append(layoutDock);layoutDock.hidden=page!=='history';layoutDock.style.setProperty('--idx',layouts.indexOf(layout));document.querySelectorAll('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===layout)));document.title=$('h1').textContent+' · Filecloud';if(focus){$('#toast').textContent='';window.scrollTo(0,0);$('h1').focus({preventScroll:true})}}
function switchLayout(next){layout=next;const url=new URL(location.href);url.searchParams.set('variant',layout);history.replaceState(null,'',url);render();$(`[data-layout="${layout}"]`).focus({preventScroll:true})}
function notify(text){$('#toast').textContent=text;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('#toast').textContent='',2200)}
async function copy(button){const command=button.dataset.copy==='command',node=command?$('#command'):button.previousElementSibling;
 try{await navigator.clipboard.writeText(node.textContent)}catch{const range=document.createRange();range.selectNodeContents(node);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);notify('文字已选中，请手动复制');return}
 if(button.hasAttribute('data-copied'))return;const html=button.innerHTML;button.setAttribute('data-copied','');button.innerHTML=icon('check')+(command?'已复制':'<span class="sr">已复制</span>');notify(command?'已复制预览命令':'已复制完整提交 ID');setTimeout(()=>{button.removeAttribute('data-copied');button.innerHTML=html},1800)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.layout)switchLayout(b.dataset.layout);
 else if(b.dataset.choose){selected=b.dataset.choose;render();if(matchMedia('(max-width:650px)').matches)$('#inspect h2').focus();else $(`[data-choose="${selected}"]`).focus()}
 else if(b.hasAttribute('data-expand')){expanded=!expanded;if(!expanded&&selected==='source')selected='merge';render();$('[data-expand]').focus()}
 else if(b.dataset.copy)copy(b);
 else if(b.id==='plates'){fan=!fan;b.setAttribute('aria-pressed',String(fan));$('.plate-caption').textContent=plateCaption()}
 else if(b.id==='prepare')$('dialog').showModal();else if(b.id==='cancel')$('dialog').close();else if(b.id==='confirm'){$('dialog').close();resetDone=true;render();$('#result').focus()}});
document.addEventListener('change',e=>{if(e.target.id==='health'){health=e.target.value;render();$('#health').focus()}else if(e.target.id==='pick'){selected=e.target.value;expanded=selected==='source';render();$('#pick').focus()}});
$('#switch').addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();switchLayout(layouts[(layouts.indexOf(layout)+(e.key==='ArrowRight'?1:2))%3])}});
$('#skip').onclick=e=>{e.preventDefault();$('#content').focus()};window.addEventListener('hashchange',()=>render(true));render();
</script></body></html>
