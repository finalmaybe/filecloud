name: release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  acceptance-1b:
    name: 1B acceptance (${{ matrix.goos }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
          - os: macos-latest
            goos: darwin
          - os: windows-latest
            goos: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run native filesystem and cross-platform object acceptance
        shell: bash
        run: FILECLOUD_RUN_1B=1 go test ./internal/clientapp -run '^TestCrossPlatformAcceptanceMatrix$' -count=1 -timeout=30m -v

  acceptance-1c:
    name: 1C operations and performance acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Reclaim disk for the 10 GiB acceptance fixture
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .
      - name: Run 1C acceptance
        run: ./scripts/acceptance-1c.sh

  build:
    name: Build and smoke test (${{ matrix.goos }})
    needs: [acceptance-1b, acceptance-1c]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            client_executable: filecloud-client
            server_executable: filecloud-server
            archive: tar.gz
          - os: macos-latest
            goos: darwin
            goarch: arm64
            client_executable: filecloud-client
            server_executable: filecloud-server
            archive: tar.gz
          - os: windows-latest
            goos: windows
            goarch: amd64
            client_executable: filecloud-client.exe
            server_executable: filecloud-server.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify native release target
        shell: bash
        env:
          TARGET: ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          set -euo pipefail
          host="$(go env GOHOSTOS)/$(go env GOHOSTARCH)"
          if [ "$host" != "$TARGET" ]; then
            echo "runner host $host does not match release target $TARGET" >&2
            exit 1
          fi
      - name: Build versioned binaries
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CLIENT_EXECUTABLE: ${{ matrix.client_executable }}
          SERVER_EXECUTABLE: ${{ matrix.server_executable }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          commit=$(git rev-parse HEAD)
          build_date=$(git show -s --format=%cI HEAD)
          ldflags="-s -w -X main._version=$VERSION -X main._commit=$commit -X main._buildDate=$build_date"
          mkdir -p dist/bin
          CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" \
            -o "dist/bin/$CLIENT_EXECUTABLE" ./cmd/filecloud-client
          CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" \
            -o "dist/bin/$SERVER_EXECUTABLE" ./cmd/filecloud-server
      - name: Smoke test released binaries
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          CLIENT_EXECUTABLE: ${{ matrix.client_executable }}
          SERVER_EXECUTABLE: ${{ matrix.server_executable }}
        run: >-
          go run ./tools/release-smoke
          --client-binary "dist/bin/$CLIENT_EXECUTABLE"
          --server-binary "dist/bin/$SERVER_EXECUTABLE"
          --version "$VERSION"
      - name: Generate native third-party license material
        shell: bash
        env:
          TARGET: ${{ matrix.goos }}/${{ matrix.goarch }}
        run: go run ./tools/notices --target "$TARGET" --output dist/licenses
      - name: Assemble binaries and legal material
        shell: bash
        env:
          PACKAGE: filecloud-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          CLIENT_EXECUTABLE: ${{ matrix.client_executable }}
          SERVER_EXECUTABLE: ${{ matrix.server_executable }}
        run: |
          set -euo pipefail
          mkdir -p "dist/$PACKAGE"
          cp "dist/bin/$CLIENT_EXECUTABLE" "dist/$PACKAGE/"
          cp "dist/bin/$SERVER_EXECUTABLE" "dist/$PACKAGE/"
          cp LICENSE README.md CONTEXT.md "dist/$PACKAGE/"
          cp -R docs "dist/$PACKAGE/"
          printf '%s\n' '# Filecloud Deployment' '' 'See [deployment and client usage](docs/operations/deployment-and-client.md).' \
            > "dist/$PACKAGE/DEPLOYMENT.md"
          cp dist/licenses/THIRD_PARTY_NOTICES.md "dist/$PACKAGE/"
          cp -R dist/licenses/third_party_licenses "dist/$PACKAGE/"
      - name: Create and inspect tar archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          PACKAGE: filecloud-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          CLIENT_EXECUTABLE: ${{ matrix.client_executable }}
          SERVER_EXECUTABLE: ${{ matrix.server_executable }}
        run: |
          set -euo pipefail
          tar -C dist -czf "dist/$PACKAGE.tar.gz" "$PACKAGE"
          mkdir -p dist/archive-check
          tar -C dist/archive-check -xzf "dist/$PACKAGE.tar.gz"
          test -x "dist/archive-check/$PACKAGE/$CLIENT_EXECUTABLE"
          test -x "dist/archive-check/$PACKAGE/$SERVER_EXECUTABLE"
          test -s "dist/archive-check/$PACKAGE/LICENSE"
          test -s "dist/archive-check/$PACKAGE/README.md"
          test -s "dist/archive-check/$PACKAGE/DEPLOYMENT.md"
          test -s "dist/archive-check/$PACKAGE/CONTEXT.md"
          test -s "dist/archive-check/$PACKAGE/docs/operations/deployment-and-client.md"
          test -s "dist/archive-check/$PACKAGE/docs/design/architecture.md"
          test -s "dist/archive-check/$PACKAGE/docs/distribution.md"
          test -s "dist/archive-check/$PACKAGE/THIRD_PARTY_NOTICES.md"
          test -d "dist/archive-check/$PACKAGE/third_party_licenses"
          test -n "$(find "dist/archive-check/$PACKAGE/third_party_licenses" -type f -size +0c -print -quit)"
      - name: Create and inspect zip archive
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          PACKAGE: filecloud-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          CLIENT_EXECUTABLE: ${{ matrix.client_executable }}
          SERVER_EXECUTABLE: ${{ matrix.server_executable }}
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path "dist/$env:PACKAGE" -DestinationPath "dist/$env:PACKAGE.zip"
          Expand-Archive -Path "dist/$env:PACKAGE.zip" -DestinationPath "dist/archive-check"
          foreach ($path in @(
            "dist/archive-check/$env:PACKAGE/$env:CLIENT_EXECUTABLE",
            "dist/archive-check/$env:PACKAGE/$env:SERVER_EXECUTABLE",
            "dist/archive-check/$env:PACKAGE/LICENSE",
            "dist/archive-check/$env:PACKAGE/README.md",
            "dist/archive-check/$env:PACKAGE/DEPLOYMENT.md",
            "dist/archive-check/$env:PACKAGE/CONTEXT.md",
            "dist/archive-check/$env:PACKAGE/docs/operations/deployment-and-client.md",
            "dist/archive-check/$env:PACKAGE/docs/design/architecture.md",
            "dist/archive-check/$env:PACKAGE/docs/distribution.md",
            "dist/archive-check/$env:PACKAGE/THIRD_PARTY_NOTICES.md"
          )) {
            if (-not (Test-Path -Path $path -PathType Leaf)) {
              throw "archive is missing $path"
            }
          }
          $licenseRoot = "dist/archive-check/$env:PACKAGE/third_party_licenses"
          if (-not (Test-Path -Path $licenseRoot -PathType Container)) {
            throw "archive is missing $licenseRoot"
          }
          $license = Get-ChildItem -Path $licenseRoot -File -Recurse |
            Where-Object Length -GT 0 |
            Select-Object -First 1
          if (-not $license) {
            throw "archive contains no non-empty third-party license files"
          }
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: filecloud-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/filecloud-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.*
          if-no-files-found: error

  desktop:
    needs: [acceptance-1b, acceptance-1c]
    uses: ./.github/workflows/desktop.yml

  release:
    name: Publish GitHub release
    needs: [build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: filecloud-*
          path: dist
          merge-multiple: true
      - name: Verify, checksum and publish the tagged release
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: |
          files=(filecloud-"$VERSION"-{linux-amd64.tar.gz,darwin-arm64.tar.gz,windows-amd64.zip}
                 filecloud-desktop-"$VERSION"-{linux-amd64.deb,linux-amd64.AppImage,darwin-arm64.dmg,windows-amd64.exe})
          for file in "${files[@]}"; do test -s "$file"; done
          sha256sum "${files[@]}" > SHA256SUMS
          gh release create "$VERSION" "${files[@]}" SHA256SUMS --verify-tag --title "Filecloud $VERSION" --notes-file ../docs/distribution.md
